[package]
name = "chain-monitor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chain-monitor-api"
path = "src/main.rs"

[[bin]]
name = "chain-monitor-tui"
path = "src/bin/tui.rs"

[dependencies]
tokio = { version = "1.40", features = ["full", "sync"] }
futures = "0.3"
reqwest = { version = "0.12.13", features = ["json"] }

axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

async-trait = "0.1"

anyhow = "1.0"
thiserror = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

ethers = { version = "2.0", features = ["ws"] }

solana-client = "3.0.10"
solana-sdk = "3.0.0"
solana-transaction-status = "3.0.10"
solana-commitment-config = "3.0.0"

subxt = "0.44.0"

async-stream = "0.3"
chrono = "0.4"

dotenv = "0.15"

# TUI
ratatui = "0.29.0"
crossterm = "0.29.0"

# WebSocket client for TUI
tokio-tungstenite = "0.28.0"
futures-util = "0.3"

[dev-dependencies]
proptest = "1.5"
tokio-test = "0.4"


